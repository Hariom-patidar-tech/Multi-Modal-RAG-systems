      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.RAG }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed '/^[[:space:]]*$/d' > ~/.ssh/rag.pem
          chmod 600 ~/.ssh/rag.pem
          echo "Total lines in key: $(wc -l < ~/.ssh/rag.pem)"
          ssh-keygen -y -f ~/.ssh/rag.pem > /dev/null
          echo "SSH key format is valid"
