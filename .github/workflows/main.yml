name: Deploy to EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # ---------------------------------------
      # Setup SSH Key
      # ---------------------------------------
      - name: Setup SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.RAG }}" > ~/.ssh/rag.pem

          chmod 600 ~/.ssh/rag.pem

          echo "SSH key created."

      # ---------------------------------------
      # Test SSH Connection
      # ---------------------------------------
      - name: Test SSH Connection
        shell: bash
        run: |
          echo "Testing connection to EC2..."

          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 \
            -i ~/.ssh/rag.pem \
            ubuntu@${{ secrets.EC2_HOST }} \
            "echo '================================'; echo 'EC2 CONNECTION SUCCESS'; echo '================================'"

      # ---------------------------------------
      # Deploy
      # ---------------------------------------
      - name: Deploy Application
        shell: bash
        run: |

          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -i ~/.ssh/rag.pem \
            ubuntu@${{ secrets.EC2_HOST }} << 'EOF'

            set -e

            echo "========================================"
            echo "Connected to EC2"
            echo "========================================"

            cd ~

            # Clone repository first time
            if [ ! -d "$HOME/rag-platform/.git" ]; then

              echo "Repository not found."
              echo "Cloning repository..."

              git clone \
                https://github.com/${{ github.repository }}.git \
                "$HOME/rag-platform"

            else

              echo "Repository already exists."
              echo "Updating repository..."

              cd "$HOME/rag-platform"

              git fetch origin
              git reset --hard origin/main

            fi

            cd "$HOME/rag-platform"

            echo "Project directory:"
            pwd

            echo "Latest commit:"
            git log -1 --oneline

            # --------------------------------
            # Python
            # --------------------------------

            echo "Checking Python..."

            python3 --version

            # --------------------------------
            # Virtual Environment
            # --------------------------------

            if [ ! -d "venv" ]; then

              echo "Creating virtual environment..."

              python3 -m venv venv

            fi

            source venv/bin/activate

            # --------------------------------
            # Upgrade pip
            # --------------------------------

            python -m pip install --upgrade pip

            # --------------------------------
            # Install dependencies
            # --------------------------------

            if [ -f requirements.txt ]; then

              echo "Installing requirements..."

              pip install -r requirements.txt

            else

              echo "ERROR: requirements.txt not found."

              exit 1

            fi

            # --------------------------------
            # Restart service if exists
            # --------------------------------

            if sudo systemctl list-unit-files | grep -q "rag-platform.service"; then

              echo "Restarting RAG service..."

              sudo systemctl daemon-reload
              sudo systemctl restart rag-platform
              sudo systemctl enable rag-platform

              echo "Service status:"

              sudo systemctl status rag-platform --no-pager

            else

              echo "WARNING:"
              echo "rag-platform.service does not exist yet."

              echo "Dependencies installed successfully."

            fi

            echo "========================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "========================================"

          EOF
