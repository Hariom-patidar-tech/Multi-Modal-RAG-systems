name: Deploy Multi-Modal RAG to AWS EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-24.04

    steps:

      # ----------------------------------------
      # 1. Checkout repository
      # ----------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------
      # 2. Setup SSH private key
      # ----------------------------------------
      - name: Setup SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' '${{ secrets.RAG }}' > ~/.ssh/rag_ec2.pem

          chmod 600 ~/.ssh/rag_ec2.pem

      # ----------------------------------------
      # 3. Test SSH connection
      # ----------------------------------------
      - name: Test EC2 Connection
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              -i ~/.ssh/rag_ec2.pem \
              ubuntu@${{ vars.EC2_HOST }} \
              "echo 'EC2 SSH connection successful'"

      # ----------------------------------------
      # 4. Deploy application
      # ----------------------------------------
      - name: Deploy Application
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/rag_ec2.pem \
              ubuntu@${{ vars.EC2_HOST }} << 'EOF'

            set -e

            echo "================================"
            echo "Starting deployment..."
            echo "================================"

            # --------------------------------
            # Create project directory
            # --------------------------------
            if [ ! -d "$HOME/rag-platform/.git" ]; then

              echo "Repository not found."

              rm -rf "$HOME/rag-platform"

              git clone \
                https://github.com/${{ github.repository }}.git \
                "$HOME/rag-platform"

            else

              echo "Repository already exists."
              cd "$HOME/rag-platform"

              git fetch origin
              git reset --hard origin/main

            fi

            cd "$HOME/rag-platform"

            echo "Current directory:"
            pwd

            echo "Current commit:"
            git rev-parse --short HEAD

            # --------------------------------
            # Create Python virtual environment
            # --------------------------------
            if [ ! -d "venv" ]; then
              echo "Creating virtual environment..."
              python3 -m venv venv
            fi

            # --------------------------------
            # Activate environment
            # --------------------------------
            source venv/bin/activate

            # --------------------------------
            # Upgrade pip
            # --------------------------------
            python -m pip install --upgrade pip

            # --------------------------------
            # Install requirements
            # --------------------------------
            if [ -f "requirements.txt" ]; then
              echo "Installing requirements..."
              pip install -r requirements.txt
            else
              echo "requirements.txt not found!"
              exit 1
            fi

            # --------------------------------
            # Restart application
            # --------------------------------
            if sudo systemctl list-unit-files | grep -q "^rag-platform.service"; then

              echo "Restarting rag-platform service..."

              sudo systemctl daemon-reload
              sudo systemctl restart rag-platform
              sudo systemctl enable rag-platform

              echo "Service status:"
              sudo systemctl status rag-platform --no-pager

            else

              echo "WARNING: rag-platform.service does not exist."
              echo "Application dependencies installed successfully."

            fi

            echo "================================"
            echo "Deployment completed successfully"
            echo "================================"

          EOF
