name: Test EC2 SSH

on:
  workflow_dispatch:

jobs:
  test-ssh:
    name: Test SSH to EC2
    runs-on: ubuntu-24.04

    steps:

      - name: Create PEM File
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' '${{ secrets.RAG }}' > ~/.ssh/rag.pem

          chmod 600 ~/.ssh/rag.pem

          echo "PEM file created"
          ls -l ~/.ssh/rag.pem

      - name: Check PEM
        run: |
          ssh-keygen -y -f ~/.ssh/rag.pem > /tmp/public_key.pub

          echo "PEM key format is valid"

      - name: Test SSH
        run: |
          echo "Connecting to EC2..."

          ssh \
            -vv \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o BatchMode=yes \
            -i ~/.ssh/rag.pem \
            ubuntu@${{ secrets.EC2_HOST }} \
            "echo SSH_SUCCESS"

      - name: Success
        if: success()
        run: |
          echo "================================="
          echo "EC2 SSH CONNECTION SUCCESSFUL"
          echo "================================="
