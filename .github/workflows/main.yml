name: Deploy Multi-Modal RAG to EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Frontend + Backend
    runs-on: ubuntu-24.04

    steps:

      # =========================================
      # 1. Checkout Repository
      # =========================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================
      # 2. Create SSH Key
      # =========================================

      - name: Setup SSH Key
        shell: bash
        run: |
          mkdir -p "$HOME/.ssh"

          cat > "$HOME/.ssh/rag.pem" <<'KEY'
          ${{ secrets.RAG }}
          KEY

          chmod 600 "$HOME/.ssh/rag.pem"

          echo "SSH key file created"

      # =========================================
      # 3. Validate SSH Key
      # =========================================

      - name: Validate SSH Key
        shell: bash
        run: |
          ssh-keygen -y -f "$HOME/.ssh/rag.pem" > /tmp/rag_public_key.pub

          echo "SSH private key format is valid"

      # =========================================
      # 4. Check Port 22
      # =========================================

      - name: Check EC2 SSH Port
        shell: bash
        run: |
          echo "Checking SSH port 22..."

          timeout 10 bash -c \
          "</dev/tcp/${{ secrets.EC2_HOST }}/22"

          echo "EC2 port 22 is reachable"

      # =========================================
      # 5. Test SSH
      # =========================================

      - name: Test EC2 SSH
        shell: bash
        run: |
          ssh \
            -i "$HOME/.ssh/rag.pem" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o BatchMode=yes \
            ubuntu@${{ secrets.EC2_HOST }} \
            "echo 'SSH CONNECTION SUCCESSFUL'"

      # =========================================
      # 6. Deploy
      # =========================================

      - name: Deploy Frontend and Backend
        shell: bash
        run: |

          ssh \
            -i "$HOME/.ssh/rag.pem" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o BatchMode=yes \
            ubuntu@${{ secrets.EC2_HOST }} << 'EOF'

            set -e

            echo "=========================================="
            echo "CONNECTED TO EC2"
            echo "=========================================="

            PROJECT_DIR="/home/ubuntu/Multi-Modal-RAG-systems"

            # ======================================
            # Clone / Update Repository
            # ======================================

            if [ ! -d "$PROJECT_DIR/.git" ]; then

              echo "Repository not found."
              echo "Cloning repository..."

              git clone \
                https://github.com/${{ github.repository }}.git \
                "$PROJECT_DIR"

            else

              echo "Repository already exists."

              cd "$PROJECT_DIR"

              git fetch origin

              git reset --hard origin/main

            fi

            cd "$PROJECT_DIR"

            echo "Current commit:"
            git log -1 --oneline

            # ======================================
            # BACKEND
            # ======================================

            echo "=========================================="
            echo "BACKEND DEPLOYMENT"
            echo "=========================================="

            cd "$PROJECT_DIR/backend"

            if [ ! -d "venv" ]; then

              echo "Creating Python virtual environment..."

              python3 -m venv venv

            fi

            source venv/bin/activate

            python -m pip install --upgrade pip

            if [ -f requirements.txt ]; then

              echo "Installing backend requirements..."

              pip install -r requirements.txt

            else

              echo "ERROR: requirements.txt not found"

              exit 1

            fi

            # ======================================
            # Restart Backend
            # ======================================

            if systemctl list-unit-files | grep -q "rag-backend.service"; then

              echo "Restarting RAG backend..."

              sudo systemctl daemon-reload

              sudo systemctl restart rag-backend

              sudo systemctl enable rag-backend

              sudo systemctl status rag-backend --no-pager

            else

              echo "WARNING: rag-backend.service does not exist yet."

            fi

            # ======================================
            # FRONTEND
            # ======================================

            echo "=========================================="
            echo "FRONTEND DEPLOYMENT"
            echo "=========================================="

            cd "$PROJECT_DIR/frontend"

            npm install

            npm run build

            # ======================================
            # NGINX
            # ======================================

            echo "Deploying frontend..."

            sudo mkdir -p /var/www/rag-frontend

            sudo rm -rf /var/www/rag-frontend/*

            sudo cp -r dist/* /var/www/rag-frontend/

            sudo chown -R www-data:www-data /var/www/rag-frontend

            sudo nginx -t

            sudo systemctl reload nginx

            echo "=========================================="
            echo "DEPLOYMENT SUCCESSFUL"
            echo "=========================================="

          EOF
